<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Layanan Publik Kota Taluk Kuantan" />
        <meta name="keywords" content="Kota, Taluk Kuantan, Pacu Jalur, Layanan Publik" />
        <meta name="copyright" content="2018. Kota Jalur. All rights reserved." />
        <meta name="robots" content="index,follow" />
        <meta name="googlebot" content="index,follow" />
        <meta name="rating" content="general" />
        <link rel="shortcut icon" href="assets/images/logo.png" />
        <title>Kota Jalur</title>
        <link href="https://fonts.googleapis.com/css?family=Work+Sans:400,500,600,700" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body class="bg-slate-950 text-slate-100" style="font-family: 'Work Sans', sans-serif;">
        <div class="relative min-h-screen overflow-hidden">
            <header class="absolute inset-x-0 top-0 z-30">
                <nav class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
                    <a class="text-xl font-semibold tracking-wide text-white" href="/">Kota Jalur</a>
                    <button id="toggle-menu" type="button" class="inline-flex items-center justify-center rounded-lg border border-white/30 bg-black/25 p-2 text-white lg:hidden" aria-expanded="false" aria-controls="menu1" aria-label="Toggle menu">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 5h14a1 1 0 110 2H3a1 1 0 010-2zm0 4h14a1 1 0 110 2H3a1 1 0 010-2zm14 4H3a1 1 0 100 2h14a1 1 0 100-2z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <div id="menu1" class="absolute left-4 right-4 top-full mt-2 hidden rounded-2xl border border-white/20 bg-black/75 p-4 shadow-xl backdrop-blur lg:static lg:mt-0 lg:flex lg:w-auto lg:items-center lg:gap-4 lg:border-0 lg:bg-transparent lg:p-0 lg:shadow-none lg:backdrop-blur-none">
                        <a class="block rounded-lg px-3 py-2 text-sm font-medium text-white transition hover:bg-white/10" href="contact.html">Hubungi Kami</a>
                        <form class="mt-2 flex items-center gap-2 rounded-lg bg-white/10 px-3 py-2 lg:mt-0" role="search" action="result-search.html">
                            <input class="w-full border-0 bg-transparent text-sm text-white placeholder:text-slate-300 focus:outline-none" type="text" name="keywords" placeholder="Cari ..." />
                            <button type="submit" aria-label="Cari" class="text-white/90 hover:text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" />
                                </svg>
                            </button>
                        </form>
                        <a class="mt-2 inline-flex h-9 w-9 items-center justify-center rounded-full border border-white/30 text-white transition hover:bg-white/10 lg:mt-0" href="#" aria-label="Profil pengguna">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 14a4 4 0 1 0-8 0m12 7a8 8 0 1 0-16 0" />
                            </svg>
                        </a>
                    </div>
                </nav>
            </header>

            <main>
                <section id="hero-carousel" class="relative h-screen">
                    <div class="absolute inset-0">
                        <img class="carousel-item h-full w-full object-cover" src="assets/images/kotajalur-bg.jpg" alt="Pemandangan Kota Jalur" />
                        <img class="carousel-item hidden h-full w-full object-cover" src="assets/images/kotajalur-bg-2.jpg" alt="Panorama Kuantan" />
                        <img class="carousel-item hidden h-full w-full object-cover" src="assets/images/kotajalur-bg-3.jpg" alt="Suasana Kota Jalur" />
                        <div class="absolute inset-0 bg-gradient-to-b from-slate-950/55 via-slate-950/30 to-slate-950/80"></div>
                    </div>
                    <div class="relative z-10 flex h-full flex-col items-center justify-center px-4 text-center sm:px-6 lg:px-8">
                        <h1 class="max-w-3xl text-4xl font-bold text-white drop-shadow sm:text-5xl lg:text-6xl">Selamat datang di Kota Jalur</h1>
                    </div>
                    <button id="prev-slide" class="absolute left-4 top-1/2 z-20 -translate-y-1/2 rounded-full bg-black/40 p-2 text-white hover:bg-black/60" aria-label="Slide sebelumnya">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M12.78 4.22a.75.75 0 0 1 0 1.06L8.06 10l4.72 4.72a.75.75 0 1 1-1.06 1.06l-5.25-5.25a.75.75 0 0 1 0-1.06l5.25-5.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <button id="next-slide" class="absolute right-4 top-1/2 z-20 -translate-y-1/2 rounded-full bg-black/40 p-2 text-white hover:bg-black/60" aria-label="Slide berikutnya">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M7.22 15.78a.75.75 0 0 1 0-1.06L11.94 10 7.22 5.28a.75.75 0 1 1 1.06-1.06l5.25 5.25a.75.75 0 0 1 0 1.06l-5.25 5.25a.75.75 0 0 1-1.06 0Z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </section>

                <section class="relative z-20 -mt-24 pb-16 sm:-mt-20">
                    <div class="mx-auto grid w-full max-w-4xl gap-8 rounded-3xl border border-white/20 bg-slate-900/85 px-6 py-8 shadow-2xl backdrop-blur md:grid-cols-[auto,1fr] md:items-center md:px-10">
                        <div class="flex justify-center">
                            <img class="h-28 w-28 object-contain sm:h-32 sm:w-32" src="assets/images/kuansingkab.png" alt="Logo Kabupaten Kuantan Singingi" />
                        </div>
                        <div class="grid gap-3 sm:grid-cols-2">
                            <a class="inline-flex items-center justify-center rounded-xl bg-emerald-500 px-6 py-3 text-base font-semibold text-white transition hover:bg-emerald-400" href="fasilitas.html">Fasilitas</a>
                            <a class="inline-flex items-center justify-center rounded-xl bg-sky-500 px-6 py-3 text-base font-semibold text-white transition hover:bg-sky-400" href="agenda.html">Agenda</a>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <script>
            (function () {
                var menuToggle = document.getElementById('toggle-menu');
                var menu = document.getElementById('menu1');

                if (menuToggle && menu) {
                    menuToggle.addEventListener('click', function () {
                        menu.classList.toggle('hidden');
                        menuToggle.setAttribute('aria-expanded', String(!menu.classList.contains('hidden')));
                    });
                }

                var slides = Array.prototype.slice.call(document.querySelectorAll('.carousel-item'));
                var prev = document.getElementById('prev-slide');
                var next = document.getElementById('next-slide');
                var current = 0;
                var timer;

                function render(index) {
                    slides.forEach(function (slide, slideIndex) {
                        if (slideIndex === index) {
                            slide.classList.remove('hidden');
                        } else {
                            slide.classList.add('hidden');
                        }
                    });
                    current = index;
                }

                function nextSlide() {
                    render((current + 1) % slides.length);
                }

                function prevSlide() {
                    render((current - 1 + slides.length) % slides.length);
                }

                function startAuto() {
                    timer = setInterval(nextSlide, 3000);
                }

                function restartAuto() {
                    clearInterval(timer);
                    startAuto();
                }

                if (slides.length) {
                    render(0);
                    startAuto();
                }

                if (prev) {
                    prev.addEventListener('click', function () {
                        prevSlide();
                        restartAuto();
                    });
                }

                if (next) {
                    next.addEventListener('click', function () {
                        nextSlide();
                        restartAuto();
                    });
                }
            })();
        </script>
    </body>
</html>
